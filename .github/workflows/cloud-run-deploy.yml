name: Cloud Run Deploy (agent-api)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
  FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
  GEMINI_MODEL_LIGHT: ${{ secrets.GEMINI_MODEL_LIGHT }}
  GEMINI_MODEL_HEAVY: ${{ secrets.GEMINI_MODEL_HEAVY }}
  GEMINI_MODEL_VISION: ${{ secrets.GEMINI_MODEL_VISION }}
  GEMINI_ENABLED: ${{ secrets.GEMINI_ENABLED }}
  ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
  ALLOW_UNAUTHENTICATED: ${{ secrets.ALLOW_UNAUTHENTICATED }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        shell: bash
        run: |
          if [ -z "${GCP_PROJECT_ID}" ] || [ -z "${GCP_REGION}" ] || [ -z "${CLOUD_RUN_SERVICE}" ]; then
            echo "Missing required secrets: GCP_PROJECT_ID, GCP_REGION, CLOUD_RUN_SERVICE" >&2
            exit 1
          fi

          # Set default values for optional environment variables
          FIREBASE_STORAGE_BUCKET="${FIREBASE_STORAGE_BUCKET:-hackason-grab.firebasestorage.app}"
          FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID:-hackason-grab}"
          GEMINI_MODEL="${GEMINI_MODEL:-gemini-2.5-flash}"
          GEMINI_MODEL_LIGHT="${GEMINI_MODEL_LIGHT:-gemini-2.5-flash}"
          GEMINI_MODEL_HEAVY="${GEMINI_MODEL_HEAVY:-gemini-2.5-pro}"
          GEMINI_MODEL_VISION="${GEMINI_MODEL_VISION:-gemini-2.5-pro}"
          GEMINI_ENABLED="${GEMINI_ENABLED:-true}"
          ALLOWED_ORIGINS="${ALLOWED_ORIGINS:-https://hackason-grab.web.app,https://hackason-grab.firebaseapp.com,http://localhost:3000}"

          FLAGS=""
          if [ "${ALLOW_UNAUTHENTICATED}" = "true" ]; then
            FLAGS="--allow-unauthenticated"
          fi

          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --source services/agent-api \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --platform managed \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 80 \
            --timeout 60s \
            --clear-base-image \
            --set-env-vars="^|^FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}|FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}|GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}|GOOGLE_CLOUD_LOCATION=${GCP_REGION}|GOOGLE_GENAI_USE_VERTEXAI=true|GEMINI_MODEL=${GEMINI_MODEL}|GEMINI_MODEL_LIGHT=${GEMINI_MODEL_LIGHT}|GEMINI_MODEL_HEAVY=${GEMINI_MODEL_HEAVY}|GEMINI_MODEL_VISION=${GEMINI_MODEL_VISION}|GEMINI_ENABLED=${GEMINI_ENABLED}|ALLOWED_ORIGINS=${ALLOWED_ORIGINS}|ENVIRONMENT=production" \
            ${FLAGS}
